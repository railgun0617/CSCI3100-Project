steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/csci3100-sqlite', '.']
  
  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/csci3100-sqlite']
  
  # Deploy to Cloud Run (optional, can be run separately)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'csci3100-sqlite'
      - '--image=gcr.io/$PROJECT_ID/csci3100-sqlite'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--concurrency=1'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--add-volume=name=sqlite-data,type=cloud-storage,bucket=${_BUCKET_NAME}'
      - '--add-volume-mount=volume=sqlite-data,mount-path=/app/storage'
      - '--set-env-vars=RAILS_ENV=production,SECRET_KEY_BASE=${_SECRET_KEY_BASE},SEND_EMAILS=false'

images:
  - 'gcr.io/$PROJECT_ID/csci3100-sqlite'

substitutions:
  _BUCKET_NAME: your-bucket-name
  _SECRET_KEY_BASE: dummy-change-me