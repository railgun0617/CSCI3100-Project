{"source":{"uri":"features/equipment.feature","data":"Feature: Equipment Page\n\n  As a student\n  So that I can book the equipments from the website\n  I want to check the equipments\n\n  Scenario: See All of the Equipments\n    Given the equipment \"Projector\" exists\n    And I am on the equipment page\n    Then I should see the equipment \"Projector\"","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/equipment_and_venue.feature","data":"Feature: Equipment and Venue Page\n\n  As a student\n  So that I can book the equipments and venues from the website\n  I want to check the equipments and venues\n\n  Scenario: See All of the Equipments and Venues\n    Given the equipment \"Projector\" exists\n    And the venue \"Library\" exists\n    And I am on the equipment and venue page\n    Then I should see the equipment \"Projector\"\n    And I should see the venue \"Library\"","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/login.feature","data":"Feature: Sign Up and Sign In page\n  \n  As a student\n  So that I can book equipment and venues\n  I want to sign up an account and sign in\n\n\n\n# Sign Up Page\n\n  Scenario: Successful Registerion\n    Given I am on the sign up page\n    And I type the email as \"1155123456@link.cuhk.edu.hk\"\n    And I type the password as \"qwerty123\"\n    And I type the password confirmation as \"qwerty123\"\n    When I click the \"Sign Up\" button\n    Then it should show \"Successful Registeration\"\n\n  Scenario: Blank Email and Password\n    Given I am on the sign up page\n    When I click the \"Sign Up\" button\n    Then It should pop \"Email can't be blank\" error message\n    And It should pop \"Password can't be blank\" error message\n\n  Scenario: Mismatch Password Confirmation\n    Given I am on the sign up page\n    And I type the email as \"1155123456@link.cuhk.edu.hk\"\n    And I type the password as \"qwerty123\"\n    And I type the password confirmation as \"qwertt123\"\n    When I click the \"Sign Up\" button\n    Then it should pop \"Password confirmation doesn't match Password\" error message\n\n  Scenario: Password Too Short\n    Given I am on the sign up page\n    And I type the email as \"1155123456@link.cuhk.edu.hk\"\n    And I type the password as \"156\"\n    And I type the password confirmation as \"156\"\n    When I click the \"Sign Up\" button\n    Then it should pop \"Password is too short (minimum is 6 characters)\" error message\n\n\n\n# Sign In Page\n\n  Scenario: Successful Login\n    Given I am on the sign in page\n    And I type all the information correctly\n    When I click the \"Log In\" button\n    Then it should show \"Successful Login\"\n\n#  Scenario: Correct Email\n#    Given I am on the sign in page\n#    And I type the email as \"1155123456@link.cuhk.edu.hk\"\n#    When I click the \"Log In\" button\n#    Then it should not pop a warning\n    \n#  Scenario: Incorrect Email or Password\n#    Given I am on the sign in page\n#    And I type the email as \"1155123456link.cuhk.edu.hk\"\n#    When I click the \"Log In\" button\n#    Then It should pop a warning\n    ","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/navigation.feature","data":"# Line Coverage Report: coverage\\index.html\n\nFeature: Navigation from one page to another\n\n  As a student\n  So that I can enjoy some functions from the website\n  I want to go to different pages\n\n  Scenario: go to main page\n    Given I am on the sign in page\n    When I click 'CUHK Booking'\n    Then I should be on the main page\n","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/venue.feature","data":"Feature: Venue Page\n\n  As a student\n  So that I can book the venues from the website\n  I want to check the venues\n\n  Scenario: See All of the Venues\n    Given the venue \"Library\" exists\n    And I am on the venue page\n    Then I should see the venue \"Library\"","mediaType":"text/x.cucumber.gherkin+plain"}},
