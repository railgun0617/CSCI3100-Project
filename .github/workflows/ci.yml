name: CI

on:
  pull_request:
  push:
    branches: [ master, main, cucumber ]

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bundle exec rails db:prepare

      - name: Run RSpec tests
        run: bundle exec rspec

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rspec
          path: coverage

  cucumber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bundle exec rails db:prepare

      - name: Run Cucumber tests
        run: bundle exec cucumber

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cucumber
          path: coverage

  collate-coverage:
    runs-on: ubuntu-latest
    needs: [rspec, cucumber]   # wait until both finish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-rspec
          path: coverage/rspec

      - uses: actions/download-artifact@v4
        with:
          name: coverage-cucumber
          path: coverage/cucumber

      - name: Collate coverage
        run: bundle exec ruby coverage_collate.rb
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
