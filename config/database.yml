# config/database.yml
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: /app/storage/production.sqlite3
    timeout: 10000
  cache:
    <<: *default
    database: /app/storage/production_cache.sqlite3
    timeout: 10000
  queue:
    <<: *default
    database: /app/storage/production_queue.sqlite3
    timeout: 10000
  cable:
    <<: *default
    database: /app/storage/production_cable.sqlite3
    timeout: 10000